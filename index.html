<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sign in to your account."
    />
    <title>Sign in</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --ink: #17251f;
        --muted: #738079;
        --line: #e3e9e5;
        --green: #246b4b;
        --green-dark: #1b543a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: #f6f8f5;
      }

      button,
      input {
        font: inherit;
      }

      .page {
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr) minmax(420px, 0.92fr);
      }

      .welcome-panel {
        position: relative;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 42px clamp(32px, 6vw, 88px) 32px;
        color: #fff;
        background:
          radial-gradient(ellipse at 15% 82%, #72a784 0, transparent 38%),
          radial-gradient(ellipse at 88% 12%, #97b89a 0, transparent 35%),
          linear-gradient(145deg, #234e3a 0%, #356c4b 54%, #628b64 100%);
      }

      .welcome-panel::before,
      .welcome-panel::after {
        position: absolute;
        width: 410px;
        height: 410px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 50%;
        content: "";
        pointer-events: none;
      }

      .welcome-panel::before {
        right: -155px;
        bottom: -130px;
      }

      .welcome-panel::after {
        right: -80px;
        bottom: -55px;
        width: 260px;
        height: 260px;
      }

      .brand {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        color: inherit;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 35%);
        border-radius: 12px;
        background: rgb(255 255 255 / 12%);
      }

      .brand-mark svg {
        width: 21px;
        height: 21px;
      }

      .welcome-copy {
        position: relative;
        z-index: 1;
        max-width: 490px;
        margin: 80px 0;
      }

      .eyebrow {
        margin: 0 0 19px;
        color: #d5e9d8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .welcome-copy h1 {
        max-width: 440px;
        margin: 0;
        font-size: clamp(42px, 5.2vw, 68px);
        font-weight: 600;
        letter-spacing: -0.065em;
        line-height: 1.05;
      }

      .welcome-copy > p:last-child {
        max-width: 375px;
        margin: 22px 0 0;
        color: rgb(255 255 255 / 78%);
        font-size: 16px;
        line-height: 1.7;
      }

      .panel-footer {
        position: relative;
        z-index: 1;
        margin: 0;
        color: rgb(255 255 255 / 70%);
        font-size: 12px;
      }

      .form-panel {
        display: grid;
        min-height: 100vh;
        padding: 32px;
        place-items: center;
        background: #fff;
      }

      .login-card {
        width: min(100%, 390px);
        padding: 24px 0;
      }

      .mobile-brand {
        display: none;
        margin-bottom: 44px;
        color: var(--green);
      }

      .login-card h2 {
        margin: 0;
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 10px 0 34px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .field {
        margin-bottom: 21px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .input-wrap {
        position: relative;
      }

      .field input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        color: var(--ink);
        background: #fff;
        font-size: 14px;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .field input::placeholder {
        color: #a0aaa4;
      }

      .field input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgb(36 107 75 / 12%);
      }

      .field input[aria-invalid="true"] {
        border-color: #bd4242;
      }

      .password-input {
        padding-right: 72px !important;
      }

      .toggle-password {
        position: absolute;
        top: 50%;
        right: 12px;
        padding: 5px 0 5px 8px;
        transform: translateY(-50%);
        border: 0;
        color: var(--green);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 650;
      }

      .toggle-password:focus-visible,
      .text-link:focus-visible,
      .submit-button:focus-visible {
        outline: 3px solid rgb(36 107 75 / 28%);
        outline-offset: 3px;
      }

      .form-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 3px 0 25px;
        font-size: 12px;
      }

      .remember-option {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4f5d55;
        cursor: pointer;
      }

      .remember-option input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--green);
      }

      .text-link {
        color: var(--green);
        font-weight: 600;
        text-decoration: none;
      }

      .text-link:hover {
        text-decoration: underline;
      }

      .submit-button {
        width: 100%;
        min-height: 49px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: var(--green);
        cursor: pointer;
        font-size: 14px;
        font-weight: 650;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .submit-button:hover {
        background: var(--green-dark);
      }

      .submit-button:active {
        transform: translateY(1px);
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.75;
      }

      .form-message {
        min-height: 20px;
        margin: 13px 0 0;
        color: #a33434;
        font-size: 12px;
        line-height: 1.5;
      }

      .form-message[data-state="info"] {
        color: var(--green-dark);
      }

      .signup-prompt {
        margin: 25px 0 0;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .signup-prompt a {
        margin-left: 3px;
      }

      @media (max-width: 800px) {
        .page {
          grid-template-columns: minmax(0, 0.78fr) minmax(370px, 1fr);
        }

        .welcome-panel {
          padding-right: 36px;
          padding-left: 36px;
        }

        .welcome-copy h1 {
          font-size: clamp(40px, 6vw, 56px);
        }
      }

      @media (max-width: 650px) {
        .page {
          display: block;
        }

        .welcome-panel {
          display: none;
        }

        .form-panel {
          min-height: 100vh;
          padding: 28px 24px;
        }

        .login-card {
          width: min(100%, 390px);
        }

        .mobile-brand {
          display: inline-flex;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="welcome-panel" aria-label="Welcome">
        <a class="brand" href="#" aria-label="Evergreen home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 20V10m0 5c-4.2 0-7-2.8-7-7 4.2 0 7 2.8 7 7Zm0-3c0-4.2 2.8-7 7-7 0 4.2-2.8 7-7 7Z"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.7"
              />
            </svg>
          </span>
          Evergreen
        </a>
        <div class="welcome-copy">
          <p class="eyebrow">A little room to grow</p>
          <h1>Welcome back to your space.</h1>
          <p>
            Sign in to pick up where you left off and keep everything moving
            forward.
          </p>
        </div>
        <p class="panel-footer">A calmer way to get things done.</p>
      </section>

      <section class="form-panel" aria-labelledby="login-title">
        <div class="login-card">
          <a class="brand mobile-brand" href="#" aria-label="Evergreen home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 20V10m0 5c-4.2 0-7-2.8-7-7 4.2 0 7 2.8 7 7Zm0-3c0-4.2 2.8-7 7-7 0 4.2-2.8 7-7 7Z"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.7"
                />
              </svg>
            </span>
            Evergreen
          </a>

          <h2 id="login-title">Sign in</h2>
          <p class="subtitle">Enter your details below to access your account.</p>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="you@example.com"
                required
                aria-describedby="form-message"
              />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <input
                  class="password-input"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  required
                  minlength="8"
                  aria-describedby="form-message"
                />
                <button
                  class="toggle-password"
                  id="toggle-password"
                  type="button"
                  aria-controls="password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember-option" for="remember">
                <input id="remember" name="remember" type="checkbox" />
                Remember me
              </label>
              <a class="text-link" href="mailto:support@example.com?subject=Password%20reset">
                Forgot password?
              </a>
            </div>

            <button class="submit-button" type="submit">Sign in</button>
            <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          </form>

          <p class="signup-prompt">
            New here? <a class="text-link" href="mailto:support@example.com?subject=Create%20an%20account">Contact us</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const emailInput = document.querySelector("#email");
      const passwordInput = document.querySelector("#password");
      const togglePassword = document.querySelector("#toggle-password");
      const message = document.querySelector("#form-message");

      togglePassword.addEventListener("click", () => {
        const isVisible = passwordInput.type === "text";
        passwordInput.type = isVisible ? "password" : "text";
        togglePassword.textContent = isVisible ? "Show" : "Hide";
        togglePassword.setAttribute("aria-pressed", String(!isVisible));
      });

      form.addEventListener("input", (event) => {
        if (event.target instanceof HTMLInputElement) {
          event.target.removeAttribute("aria-invalid");
          message.textContent = "";
          message.removeAttribute("data-state");
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        message.textContent = "";
        message.removeAttribute("data-state");
        emailInput.removeAttribute("aria-invalid");
        passwordInput.removeAttribute("aria-invalid");

        if (!emailInput.validity.valid) {
          emailInput.setAttribute("aria-invalid", "true");
          message.textContent = emailInput.value
            ? "Enter a valid email address."
            : "Enter your email address.";
          emailInput.focus();
          return;
        }

        if (!passwordInput.value) {
          passwordInput.setAttribute("aria-invalid", "true");
          message.textContent = "Enter your password.";
          passwordInput.focus();
          return;
        }

        message.dataset.state = "info";
        message.textContent =
          "The sign-in service is not connected yet. Connect an authentication backend to verify your account.";
      });
    </script>
  </body>
</html>
